<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信貸 × 保單 財務試算</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600&family=DM+Mono:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap');

:root {
  /* Tiffany palette */
  --tiffany:     #0abab5;
  --tiffany-lt:  #81d8d0;
  --tiffany-pale:#c4eeec;
  --tiffany-dim: #0abab530;
  --tiffany-glow:#0abab518;

  --bg:          #f0fafa;
  --bg2:         #e4f5f4;
  --surface:     #ffffff;
  --surface2:    #f4fcfb;
  --border:      #b8e4e2;
  --border-lt:   #d6f0ef;

  --text:        #1a3535;
  --text-muted:  #4a7070;
  --text-dim:    #8aabaa;

  --red:         #d95f5f;
  --green:       #2a9d8f;
  --amber:       #e07c3a;
  --blue:        #4a7faa;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Serif TC', serif;
  min-height: 100vh;
}

/* === subtle wave bg === */
body::before {
  content:'';
  position:fixed; inset:0;
  background:
    radial-gradient(ellipse 80% 50% at 10% 20%, rgba(10,186,181,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 90% 80%, rgba(10,186,181,0.06) 0%, transparent 60%);
  pointer-events:none; z-index:0;
}

body::after {
  content:'';
  position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(10,186,181,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(10,186,181,0.04) 1px, transparent 1px);
  background-size:32px 32px;
  pointer-events:none; z-index:0;
}

.container {
  position:relative; z-index:1;
  max-width:1160px;
  margin:0 auto;
  padding:44px 24px 100px;
}

/* === HEADER === */
header {
  text-align:center;
  margin-bottom:52px;
  padding-bottom:44px;
  border-bottom:1px solid var(--border);
  position:relative;
}

header::after {
  content:'';
  position:absolute;
  bottom:-1px; left:50%; transform:translateX(-50%);
  width:120px; height:2px;
  background:linear-gradient(90deg, transparent, var(--tiffany), transparent);
}

.eyebrow {
  font-family:'DM Mono', monospace;
  font-size:13px;
  letter-spacing:5px;
  color:var(--tiffany);
  text-transform:uppercase;
  margin-bottom:18px;
}

h1 {
  font-family:'Cormorant Garamond', serif;
  font-size:clamp(38px,6vw,64px);
  font-weight:300;
  color:var(--text);
  line-height:1.05;
  margin-bottom:10px;
  letter-spacing:-1px;
}

h1 em {
  font-style:italic;
  color:var(--tiffany);
  font-weight:300;
}

.header-sub {
  font-family:'DM Mono', monospace;
  font-size:14px;
  color:var(--text-dim);
  letter-spacing:2px;
}

/* === LAYOUT === */
.layout {
  display:grid;
  grid-template-columns:380px 1fr;
  gap:24px;
  align-items:start;
}
@media(max-width:860px){ .layout{ grid-template-columns:1fr; } }

/* === PANELS === */
.panel {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:4px;
  overflow:hidden;
  box-shadow:0 2px 20px rgba(10,186,181,0.06);
}

.panel-head {
  background:var(--surface2);
  padding:14px 20px;
  border-bottom:1px solid var(--border-lt);
  display:flex; align-items:center; gap:10px;
}

.ph-dot {
  width:7px; height:7px; border-radius:50%;
  background:var(--tiffany);
  box-shadow:0 0 6px var(--tiffany);
}

.ph-title {
  font-family:'DM Mono', monospace;
  font-size:13px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--text-muted);
}

.panel-body { padding:20px; }

/* === SECTION LABELS === */
.sec-label {
  font-family:'DM Mono', monospace;
  font-size:12px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--tiffany);
  margin-bottom:14px;
  padding-bottom:8px;
  border-bottom:1px solid var(--border-lt);
  display:flex; align-items:center; gap:8px;
}
.sec-label::before {
  content:'';
  display:inline-block;
  width:14px; height:1px;
  background:var(--tiffany);
}

/* === INPUTS === */
.ig { margin-bottom:14px; }

.il {
  display:block;
  font-size:14px;
  color:var(--text-muted);
  margin-bottom:6px;
  font-weight:400;
  letter-spacing:0.3px;
}

.ir {
  display:flex; align-items:center; gap:8px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:3px;
  padding:0 14px;
  transition:border-color 0.2s, box-shadow 0.2s;
}
.ir:focus-within {
  border-color:var(--tiffany);
  box-shadow:0 0 0 3px var(--tiffany-dim);
}
.ir input {
  flex:1; background:transparent; border:none; outline:none;
  color:var(--text);
  font-family:'DM Mono', monospace;
  font-size:17px;
  padding:12px 0;
}
.ir input::placeholder { color:var(--text-dim); }
.iu {
  font-family:'DM Mono', monospace;
  font-size:14px;
  color:var(--text-dim);
  white-space:nowrap;
}

/* === SELF-FUND HIGHLIGHT BOX === */
.fund-box {
  background:linear-gradient(135deg, var(--tiffany-glow), rgba(10,186,181,0.04));
  border:1px solid var(--tiffany);
  border-radius:4px;
  padding:14px;
  margin-bottom:14px;
}
.fund-box .sec-label { color:var(--tiffany); border-color:rgba(10,186,181,0.3); margin-bottom:12px; }
.fund-box .il { color:var(--tiffany); opacity:0.85; }
.fund-box .ir { background:rgba(255,255,255,0.7); border-color:rgba(10,186,181,0.4); }
.fund-box .ir input { color:var(--tiffany); }
.fund-hint {
  font-size:13px;
  color:var(--tiffany);
  opacity:0.7;
  margin-top:6px;
  font-family:'DM Mono', monospace;
  letter-spacing:0.3px;
  line-height:1.6;
}

/* === TOGGLES === */
.tg { margin-bottom:14px; }
.tg-label { font-size:14px; color:var(--text-muted); margin-bottom:8px; display:block; }
.tg-opts {
  display:flex;
  border:1px solid var(--border);
  border-radius:3px;
  overflow:hidden;
}
.tg-opts input[type=radio]{ display:none; }
.tg-opts label {
  flex:1; text-align:center;
  padding:11px 6px;
  font-family:'DM Mono', monospace;
  font-size:13px; letter-spacing:1px;
  cursor:pointer;
  transition:all 0.2s;
  color:var(--text-dim);
  background:var(--bg);
  border-right:1px solid var(--border);
  user-select:none;
}
.tg-opts label:last-child{ border-right:none; }
.tg-opts input:checked + label {
  background:var(--tiffany);
  color:#fff;
  font-weight:500;
}

/* === BUTTON === */
.calc-btn {
  width:100%;
  padding:16px;
  background:var(--tiffany);
  color:#fff;
  border:none; border-radius:3px;
  font-family:'DM Mono', monospace;
  font-size:14px; letter-spacing:4px;
  text-transform:uppercase;
  cursor:pointer;
  margin-top:20px;
  transition:all 0.25s;
  font-weight:500;
  box-shadow:0 4px 16px rgba(10,186,181,0.25);
}
.calc-btn:hover {
  background:#08a8a3;
  transform:translateY(-1px);
  box-shadow:0 6px 20px rgba(10,186,181,0.35);
}
.calc-btn:active { transform:translateY(0); }

.sep { margin:16px 0; border:none; border-top:1px solid var(--border-lt); }

/* === RESULTS === */
.results-panel { display:flex; flex-direction:column; gap:20px; }

/* Scenario tabs */
.tabs {
  display:flex;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:4px;
  overflow:hidden;
}
.tab-btn {
  flex:1; padding:14px 8px;
  font-family:'DM Mono', monospace;
  font-size:13px; letter-spacing:1px;
  text-transform:uppercase;
  border:none; cursor:pointer;
  background:transparent;
  color:var(--text-muted);
  transition:all 0.2s;
  border-right:1px solid var(--border);
}
.tab-btn:last-child{ border-right:none; }
.tab-btn.active {
  background:var(--tiffany);
  color:#fff;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,0.1);
}

.tab-content { display:none; }
.tab-content.active { display:flex; flex-direction:column; gap:20px; }

/* === STAT CARDS === */
.cards {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
@media(max-width:600px){ .cards{ grid-template-columns:1fr 1fr; } }

.card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:4px;
  padding:16px;
  position:relative;
  overflow:hidden;
  transition:box-shadow 0.2s;
}
.card:hover { box-shadow:0 4px 16px rgba(10,186,181,0.1); }
.card::before {
  content:'';
  position:absolute; top:0; left:0; right:0;
  height:2px;
}
.card.tif::before { background:var(--tiffany); }
.card.grn::before { background:var(--green); }
.card.red::before { background:var(--red); }
.card.amb::before { background:var(--amber); }
.card.blu::before { background:var(--blue); }

.card-label {
  font-family:'DM Mono', monospace;
  font-size:12px; letter-spacing:1px;
  text-transform:uppercase;
  color:var(--text-dim);
  margin-bottom:10px;
}
.card-val {
  font-family:'DM Mono', monospace;
  font-size:24px; font-weight:500;
  color:var(--text);
  line-height:1;
}
.card-val.tif { color:var(--tiffany); }
.card-val.grn { color:var(--green); }
.card-val.red { color:var(--red); }
.card-val.amb { color:var(--amber); }
.card-sub {
  font-family:'DM Mono', monospace;
  font-size:12px; color:var(--text-dim);
  margin-top:6px;
}

/* === COMPARE BADGE (自備款加碼差異) === */
.diff-badge {
  display:inline-flex; align-items:center; gap:4px;
  font-family:'DM Mono', monospace;
  font-size:9px;
  padding:2px 6px;
  border-radius:2px;
  margin-top:4px;
}
.diff-badge.up { background:rgba(42,157,143,0.12); color:var(--green); }
.diff-badge.dn { background:rgba(217,95,95,0.12); color:var(--red); }

/* === TABLE === */
.tw { overflow-x:auto; }
table {
  width:100%; border-collapse:collapse;
  font-family:'DM Mono', monospace;
  font-size:14px;
}
thead tr {
  background:var(--surface2);
  border-bottom:2px solid var(--tiffany);
}
th {
  padding:13px 12px;
  text-align:right;
  font-size:12px; letter-spacing:1px;
  text-transform:uppercase;
  color:var(--tiffany);
  font-weight:500;
  white-space:nowrap;
}
th:first-child { text-align:left; }
tbody tr {
  border-bottom:1px solid var(--border-lt);
  transition:background 0.15s;
}
tbody tr:hover { background:var(--surface2); }
tbody tr.hl {
  background:rgba(10,186,181,0.04);
  border-bottom:1px solid rgba(10,186,181,0.2);
}
td {
  padding:13px 12px;
  text-align:right;
  color:var(--text);
  font-size:14px;
  white-space:nowrap;
}
td:first-child { text-align:left; color:var(--text-muted); }
td.pos { color:var(--green); }
td.neg { color:var(--red); }
td.tif { color:var(--tiffany); }
td.dim { color:var(--text-dim); }
tfoot tr {
  border-top:2px solid var(--border);
  background:var(--surface2);
}
tfoot td { padding:13px 12px; font-weight:500; font-size:14px; }

/* note row */
.note-row td {
  padding:4px 12px 12px;
  font-size:13px;
  color:var(--tiffany);
  letter-spacing:0.3px;
  background:rgba(10,186,181,0.02);
}

/* year badge */
.ybadge {
  display:inline-flex; align-items:center; justify-content:center;
  width:36px; height:24px;
  border:1px solid var(--border);
  border-radius:2px;
  font-size:13px;
  color:var(--text-muted);
  background:var(--bg);
}
.ybadge.last {
  background:var(--tiffany);
  border-color:var(--tiffany);
  color:#fff;
}

/* === NOTE BOX === */
.note-box {
  background:var(--tiffany-glow);
  border:1px solid rgba(10,186,181,0.25);
  border-radius:3px;
  padding:16px 18px;
}
.note-box p {
  font-size:15px; color:var(--text-muted);
  line-height:1.8; font-weight:300;
}
.note-box p + p { margin-top:8px; }
.note-box strong { color:var(--tiffany); font-weight:500; }

/* placeholder */
.placeholder {
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:70px 20px;
  gap:14px;
}
.placeholder-icon {
  width:52px; height:52px;
  border:2px solid var(--border);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  color:var(--text-dim); font-size:22px;
}
.placeholder p {
  font-family:'DM Mono', monospace;
  font-size:13px; letter-spacing:3px;
  text-transform:uppercase;
  color:var(--text-dim);
}

.policy-note { font-size:12px; color:var(--text-dim); }
</style>
</head>
<body>
<div class="container">

<header>
  <p class="eyebrow">Financial Strategy Simulator</p>
  <h1>信貸 <em>×</em> 投資型保單<br>槓桿策略試算</h1>
  <p class="header-sub">Personal Loan · Investment Policy · Self-Fund Scenario</p>
</header>

<div class="layout">

<!-- ===== LEFT: PARAMS ===== -->
<div>
<div class="panel">
  <div class="panel-head">
    <div class="ph-dot"></div>
    <span class="ph-title">參數設定</span>
  </div>
  <div class="panel-body">

    <p class="sec-label">信貸條件</p>

    <div class="ig">
      <label class="il">信貸額度</label>
      <div class="ir"><input type="number" id="loanAmount" value="1000000" min="1" oninput="syncPolicyAmount()"><span class="iu">元</span></div>
    </div>
    <div class="ig">
      <label class="il">年利率</label>
      <div class="ir"><input type="number" id="loanRate" value="3" step="0.01" min="0"><span class="iu">%</span></div>
    </div>
    <div class="ig">
      <label class="il">綁約年限</label>
      <div class="ir"><input type="number" id="lockYear" value="1" min="1"><span class="iu">年</span></div>
    </div>
    <div class="ig">
      <label class="il">分期年數</label>
      <div class="ir"><input type="number" id="loanYears" value="7" min="2" max="30"><span class="iu">年</span></div>
    </div>

    <hr class="sep">
    <p class="sec-label">投資型保單條件</p>

    <div class="ig">
      <label class="il">保單投入本金（等於信貸額度）</label>
      <div class="ir" style="background:var(--surface2);cursor:not-allowed;">
        <span id="policyAmountDisplay" style="font-family:'DM Mono',monospace;font-size:17px;color:var(--tiffany);padding:12px 0;flex:1;">1,000,000</span>
        <span class="iu">元</span>
      </div>
    </div>
    <div class="ig">
      <label class="il">每年投資報酬率</label>
      <div class="ir"><input type="number" id="policyReturn" value="6" step="0.01" min="0"><span class="iu">%</span></div>
    </div>
    <div class="ig">
      <label class="il">保單可貸比例（佔總本金）</label>
      <div class="ir"><input type="number" id="policyLoanPct" value="60" step="1" min="0" max="100" oninput="updateLoanMaxPreview()"><span class="iu">%</span></div>
      <div id="loanMaxPreview" style="font-family:'DM Mono',monospace;font-size:12px;color:var(--tiffany);margin-top:5px;padding-left:2px;">
        ▸ 可貸上限：<span id="loanMaxVal">—</span> 元
      </div>
    </div>
    <div class="ig">
      <label class="il">保單借款年利率</label>
      <div class="ir"><input type="number" id="policyLoanRate" value="4.32" step="0.01" min="0"><span class="iu">%</span></div>
    </div>

    <hr class="sep">

    <!-- 自備款高亮區 -->
    <div class="fund-box">
      <p class="sec-label">自備款加碼</p>
      <div class="ig">
        <label class="il">自備款金額</label>
        <div class="ir"><input type="number" id="selfFund" value="500000" min="0" oninput="updateLoanMaxPreview()"><span class="iu">元</span></div>
      </div>
      <p class="fund-hint">▸ 自備款將直接加入保單投資本金<br>▸ 兩方案同步試算並對比差異</p>
    </div>

    <hr class="sep">
    <p class="sec-label">還款方式</p>

    <div class="tg">
      <span class="tg-label">保單借款還款方式（第3年起）</span>
      <div class="tg-opts">
        <input type="radio" name="policyRepay" id="rInterest" value="interest" checked>
        <label for="rInterest">只還利息</label>
        <input type="radio" name="policyRepay" id="rFull" value="full">
        <label for="rFull">連本帶利</label>
      </div>
    </div>
    <div class="tg">
      <span class="tg-label">最後一年保單本金</span>
      <div class="tg-opts">
        <input type="radio" name="policyFinal" id="fPay" value="pay" checked>
        <label for="fPay">還清本金</label>
        <input type="radio" name="policyFinal" id="fKeep" value="keep">
        <label for="fKeep">只還利息</label>
      </div>
    </div>

    <button class="calc-btn" onclick="calculate()">▶ 開始試算</button>
  </div>
</div>
</div>

<!-- ===== RIGHT: RESULTS ===== -->
<div class="results-panel" id="resultsPanel">
  <div class="panel">
    <div class="panel-body">
      <div class="placeholder">
        <div class="placeholder-icon">◈</div>
        <p>設定參數後按下試算</p>
      </div>
    </div>
  </div>
</div>

</div><!-- layout -->
</div><!-- container -->

<script>
function fmt(n){ return Math.round(n).toLocaleString('zh-TW'); }

function pmt(r, n, pv){
  if(r===0) return pv/n;
  return pv*(r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1);
}

function remBal(mr, total, paid, pv){
  if(pv<=0) return 0;
  return pv*(Math.pow(1+mr,total)-Math.pow(1+mr,paid))/(Math.pow(1+mr,total)-1);
}

function calcScenario(params){
  const {loanAmount, loanRate, loanYears, policyBase, selfFund,
         policyReturn, policyLoanMax, policyLoanRate, policyRepay, policyFinal} = params;

  const policyAmount = policyBase + selfFund;       // 保單總本金
  const mr = loanRate/12;
  const totalM = loanYears*12;

  const origMonthly = pmt(mr, totalM, loanAmount);
  const origAnnual  = origMonthly*12;
  const policyIncome = policyAmount * policyReturn; // 年獲利固定

  // Y1
  const loanBalY1 = remBal(mr, totalM, 12, loanAmount);
  const policyNeedY1 = Math.max(0, origAnnual - policyIncome);
  const policyDrawY1 = Math.min(policyNeedY1, policyLoanMax);

  // Y2: 剩餘保單額度全部還信貸本金
  const remain2 = policyLoanMax - policyDrawY1;
  const policyDrawY2 = Math.min(remain2, loanBalY1);
  const policyTotal = policyDrawY1 + policyDrawY2;
  const loanBalY2start = Math.max(0, loanBalY1 - policyDrawY2);

  const remPeriods = totalM - 12;
  const newMonthly = loanBalY2start > 0 ? pmt(mr, remPeriods, loanBalY2start) : 0;
  const newAnnual  = newMonthly*12;

  const policyIntPerYear = policyTotal * policyLoanRate;

  // 連本帶利模式保單月付
  const polRemainingYrs = loanYears - 2;
  const polMonthlyFull = policyTotal>0 && polRemainingYrs>0
    ? pmt(policyLoanRate/12, polRemainingYrs*12, policyTotal) : 0;
  const polAnnualFull = polMonthlyFull*12;

  const rows = [];
  let polBal = policyTotal;

  for(let y=1; y<=loanYears; y++){
    let r = { year:y };

    if(y===1){
      r.loanMonthly  = origMonthly;
      r.loanAnnual   = origAnnual;
      r.loanBalance  = loanBalY1;
      r.polDraw      = policyDrawY1;
      r.polRemain    = policyLoanMax - policyDrawY1;
      r.polInterest  = 0;
      r.polAnnuity   = null;
      r.policyIncome = policyIncome;
      r.cashOut      = Math.max(0, origAnnual - policyIncome - policyDrawY1);
      r.note         = `動用保單借款 ${fmt(policyDrawY1)} 元補足信貸年付`;

    } else if(y===2){
      r.loanMonthly  = newMonthly;
      r.loanAnnual   = newAnnual;
      r.loanBalance  = remBal(mr, remPeriods, 12, loanBalY2start);
      r.polDraw      = policyDrawY2;
      r.polRemain    = 0;
      r.polInterest  = policyIntPerYear;
      r.polAnnuity   = null;
      r.policyIncome = policyIncome;
      r.cashOut      = Math.max(0, newAnnual + policyIntPerYear - policyIncome);
      r.note         = `年初動用剩餘保單額度 ${fmt(policyDrawY2)} 元一次還信貸本金`;

    } else {
      const prevLoanBal = y===3
        ? remBal(mr, remPeriods, 12, loanBalY2start)
        : rows[y-2].loanBalance;
      r.loanMonthly = prevLoanBal>0.5 ? newMonthly : 0;
      r.loanAnnual  = prevLoanBal>0.5 ? newAnnual  : 0;
      r.loanBalance = prevLoanBal>0.5
        ? remBal(mr, remPeriods, (y-1)*12, loanBalY2start) : 0;
      r.polDraw   = 0;
      r.polRemain = 0;
      r.policyIncome = policyIncome;

      const isLast = y===loanYears;
      if(policyRepay==='full'){
        r.polInterest = 0;
        r.polAnnuity  = polAnnualFull;
        polBal -= (polAnnualFull - polBal*policyLoanRate);
        polBal = Math.max(0, polBal);
        if(isLast && policyFinal==='pay'){ polBal=0; r.note='信貸還清，保單借款還清'; }
        r.cashOut = Math.max(0, r.loanAnnual + polAnnualFull - policyIncome);
      } else {
        r.polInterest = policyIntPerYear;
        r.polAnnuity  = null;
        if(isLast){
          if(policyFinal==='pay'){
            r.cashOut = Math.max(0, r.loanAnnual + policyIntPerYear + policyTotal - policyIncome);
            r.note = `信貸還清，保單借款本金一次還清 ${fmt(policyTotal)} 元`;
          } else {
            r.cashOut = Math.max(0, r.loanAnnual + policyIntPerYear - policyIncome);
            r.note = '信貸還清，保單借款本金持續（只還利息）';
          }
        } else {
          r.cashOut = Math.max(0, r.loanAnnual + policyIntPerYear - policyIncome);
        }
      }
    }
    rows.push(r);
  }

  // Totals
  // 信貸總利息 = 月付合計 + Y2年初一次還本金(保單借款) - 原始貸款本金
  const totalPaidToBank = origAnnual + newAnnual*(loanYears-1) + policyDrawY2;
  const totalLoanInt    = totalPaidToBank - loanAmount;
  const totalPolCost = policyRepay==='interest'
    ? policyIntPerYear*(loanYears-1)
    : polAnnualFull*polRemainingYrs - policyTotal;
  const totalIncome  = policyIncome * loanYears;
  const netProfit    = totalIncome - totalLoanInt - totalPolCost;

  return {
    rows, origMonthly, origAnnual, newMonthly, newAnnual,
    policyTotal, policyIntPerYear, polAnnualFull,
    policyIncome, policyAmount, selfFund,
    totalLoanInt, totalPolCost, totalIncome, netProfit,
    policyRepay, policyFinal, loanYears, policyLoanMax, loanAmount
  };
}

function calculate(){
  const loanAmount    = parseFloat(document.getElementById('loanAmount').value)||0;
  const loanRate      = parseFloat(document.getElementById('loanRate').value)/100||0;
  const loanYears     = parseInt(document.getElementById('loanYears').value)||7;
  const policyBase    = loanAmount;  // 保單本金 = 信貸額度
  const policyReturn  = parseFloat(document.getElementById('policyReturn').value)/100||0;
  const policyLoanPct = parseFloat(document.getElementById('policyLoanPct').value)||0;
  const policyLoanRate= parseFloat(document.getElementById('policyLoanRate').value)/100||0;
  const selfFund      = parseFloat(document.getElementById('selfFund').value)||0;
  const policyRepay   = document.querySelector('input[name="policyRepay"]:checked').value;
  const policyFinal   = document.querySelector('input[name="policyFinal"]:checked').value;

  // 可貸上限各自以「該方案保單總本金」× 比例計算
  const policyLoanMaxA = policyBase * (policyLoanPct / 100);              // 無自備款方案
  const policyLoanMaxB = (policyBase + selfFund) * (policyLoanPct / 100); // 有自備款方案

  const base = { loanAmount, loanRate, loanYears, policyBase,
    selfFund:0, policyReturn, policyLoanMax:policyLoanMaxA,
    policyLoanRate, policyRepay, policyFinal };
  const plus = { loanAmount, loanRate, loanYears, policyBase,
    selfFund, policyReturn, policyLoanMax:policyLoanMaxB,
    policyLoanRate, policyRepay, policyFinal };

  const sA = calcScenario(base); // 無自備款
  const sB = calcScenario(plus); // 有自備款

  renderResults(sA, sB, selfFund);
}

function diffBadge(vA, vB, higherIsBetter=true){
  const d = vB - vA;
  if(Math.abs(d)<1) return '';
  const better = higherIsBetter ? d>0 : d<0;
  const cls = better ? 'up' : 'dn';
  const arrow = d>0 ? '▲' : '▼';
  return `<div class="diff-badge ${cls}">${arrow} ${fmt(Math.abs(d))}</div>`;
}

function renderTable(s){
  return s.rows.map((r,i)=>{
    const isLast = i===s.rows.length-1;
    const polPayTd = r.polAnnuity!=null
      ? `<td class="neg">${fmt(r.polAnnuity)}</td>`
      : r.polInterest>0
        ? `<td class="neg">${fmt(r.polInterest)}<span class="policy-note"> 利</span></td>`
        : `<td class="dim">—</td>`;
    const cashClass = r.cashOut>0 ? 'neg' : 'pos';
    const cashVal   = r.cashOut>0 ? `-${fmt(r.cashOut)}` : `<span class="tif">0</span>`;
    const drawTd    = r.polDraw>0
      ? `<td class="tif">+${fmt(r.polDraw)}</td>`
      : `<td class="dim">—</td>`;
    const remainTd  = r.polRemain>0
      ? `<td class="dim">${fmt(r.polRemain)}</td>`
      : `<td class="dim">0</td>`;
    return `
      <tr class="${isLast?'hl':''}">
        <td><span class="ybadge ${isLast?'last':''}">Y${r.year}</span></td>
        <td>${fmt(r.loanMonthly)}</td>
        <td>${fmt(r.loanAnnual)}</td>
        <td class="dim">${fmt(r.loanBalance)}</td>
        ${drawTd}
        ${remainTd}
        ${polPayTd}
        <td class="pos">+${fmt(r.policyIncome)}</td>
        <td class="${cashClass}">${cashVal}</td>
      </tr>
      ${r.note ? `<tr class="note-row"><td colspan="9">▸ ${r.note}</td></tr>` : ''}`;
  }).join('');
}

function renderCompare(sA, sB, selfFund){
  const rows = [
    ['保單投入本金',      fmt(sA.policyAmount)+'元',   fmt(sB.policyAmount)+'元',   true],
    ['信貸月付（第1年）', fmt(sA.origMonthly)+'元',    fmt(sB.origMonthly)+'元',    false],
    ['信貸月付（第2年起）',fmt(sA.newMonthly)+'元',    fmt(sB.newMonthly)+'元',     false],
    ['保單年度獲利',      '+'+fmt(sA.policyIncome)+'元','+'+fmt(sB.policyIncome)+'元',true],
    ['保單借款總額',      fmt(sA.policyTotal)+'元',    fmt(sB.policyTotal)+'元',    false],
    ['保單借款利息總計',  fmt(sA.totalPolCost)+'元',   fmt(sB.totalPolCost)+'元',   false],
    ['信貸總利息',        fmt(sA.totalLoanInt)+'元',   fmt(sB.totalLoanInt)+'元',   false],
    ['總利息成本',        fmt(sA.totalLoanInt+sA.totalPolCost)+'元', fmt(sB.totalLoanInt+sB.totalPolCost)+'元', false],
    ['保單總獲利',        '+'+fmt(sA.totalIncome)+'元','+'+fmt(sB.totalIncome)+'元', true],
    ['淨損益',            (sA.netProfit>=0?'+':'')+fmt(sA.netProfit)+'元', (sB.netProfit>=0?'+':'')+fmt(sB.netProfit)+'元', true],
  ];

  const netDiff = sB.netProfit - sA.netProfit;

  return `
  <div class="panel">
    <div class="panel-head"><div class="ph-dot"></div><span class="ph-title">兩方案對比總表</span></div>
    <div class="panel-body" style="padding:0">
      <div class="tw"><table>
        <thead><tr>
          <th style="text-align:left">項目</th>
          <th>無自備款</th>
          <th>＋${fmt(selfFund)}元自備款</th>
          <th>差異</th>
        </tr></thead>
        <tbody>
          ${rows.map(([label,vA,vB,hib])=>{
            const numA = parseFloat(vA.replace(/[^0-9.-]/g,''))||0;
            const numB = parseFloat(vB.replace(/[^0-9.-]/g,''))||0;
            const d = numB - numA;
            const better = hib ? d>0 : d<0;
            const dStr = Math.abs(d)<1 ? '—'
              : `<span style="color:${better?'var(--green)':'var(--red)'}">
                  ${d>0?'▲':'▼'} ${fmt(Math.abs(d))}
                 </span>`;
            return `<tr><td>${label}</td><td>${vA}</td>
              <td style="color:var(--tiffany)">${vB}</td>
              <td>${dStr}</td></tr>`;
          }).join('')}

    <p>▸ 投入自備款 <strong>${fmt(selfFund)}</strong> 元後，保單本金由 <strong>${fmt(sA.policyAmount)}</strong> 元擴大至 <strong>${fmt(sB.policyAmount)}</strong> 元</p>
    <p>▸ 年度獲利增加 <strong>+${fmt(sB.policyIncome-sA.policyIncome)}</strong> 元，7年累計多賺 <strong>+${fmt((sB.policyIncome-sA.policyIncome)*sB.loanYears)}</strong> 元</p>
    <p>▸ 淨損益差異：<strong style="color:${netDiff>=0?'var(--green)':'var(--red)'}">${netDiff>=0?'+':''}${fmt(netDiff)}</strong> 元（加入自備款${netDiff>=0?'更划算':'反而減少淨利，請確認借款利息結構'}）</p>
  </div>`;
}

function switchTab(idx, btn){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('active', i===idx);
  });
  document.querySelectorAll('.tab-content').forEach((c,i)=>{
    c.classList.toggle('active', i===idx);
  });
}

function syncPolicyAmount(){
  const v = parseFloat(document.getElementById('loanAmount').value)||0;
  const el = document.getElementById('policyAmountDisplay');
  if(el) el.textContent = Math.round(v).toLocaleString('zh-TW');
  updateLoanMaxPreview();
}

function updateLoanMaxPreview(){
  const policyBase = parseFloat(document.getElementById('loanAmount').value)||0;
  const selfFund   = parseFloat(document.getElementById('selfFund').value)||0;
  const pct        = parseFloat(document.getElementById('policyLoanPct').value)||0;
  const maxA = policyBase * (pct / 100);
  const maxB = (policyBase + selfFund) * (pct / 100);
  const el = document.getElementById('loanMaxVal');
  if(el){
    if(selfFund > 0){
      el.textContent = Math.round(maxA).toLocaleString('zh-TW')
        + ' ／ 加自備款後 ' + Math.round(maxB).toLocaleString('zh-TW');
    } else {
      el.textContent = Math.round(maxA).toLocaleString('zh-TW');
    }
  }
}

window.addEventListener('DOMContentLoaded', function(){
  updateLoanMaxPreview();
  calculate();
});
